name: StockPing checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test Java, Go, frontend, and generated contracts
        run: ./scripts/test.sh
      - name: Start local environment
        run: |
          python3 scripts/init-local-env.py
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: Verify service health, database isolation, and broker
        run: python3 scripts/smoke-test.py
      - name: Verify Catalog REST and generated-code gRPC client
        run: python3 scripts/validate-catalog.py
      - name: Verify authenticated Demand flow and Catalog outage
        run: python3 scripts/validate-demand.py
      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100
      - name: Stop environment
        if: always()
        run: docker compose down

