syntax = "proto3";
package stockping.catalog.v1;
option java_package = "dev.stockping.contracts.catalog.v1";
option java_multiple_files = true;
option go_package = "stockping.dev/messaging-service/gen/stockping/catalog/v1;catalogv1";

// Bearer JWT metadata requires merchant_id to match its signed identity.
// Internal read-only calls may use x-service-token plus trusted x-merchant-id metadata.
// All calls are unary. Local plaintext is restricted to the private development network.
service CatalogService {
  rpc ResolveProductVariant(ResolveProductVariantRequest) returns (ResolveProductVariantResponse);
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
}
message ResolveProductVariantRequest {
  string merchant_id = 1;
  string product_name = 2; // Literal case-insensitive substring, not fuzzy matching.
  string brand = 3; // Case-insensitive equality.
  string sku = 4; // Case-sensitive equality, same semantics as SKU uniqueness.
  string variant_id = 6; // Exact active variant lookup; mutually exclusive with search fields.
  map<string, string> attributes = 5; // Case-insensitive values; colour aliases color.
}
enum ResolutionStatus {
  RESOLUTION_STATUS_UNSPECIFIED = 0;
  MATCHED = 1;
  NOT_FOUND = 2;
  AMBIGUOUS = 3;
}
message Variant {
  string variant_id = 1;
  string product_id = 2;
  string sku = 3;
  string product_name = 4;
  string brand = 5;
  map<string, string> attributes = 6;
}
message ResolveProductVariantResponse {
  ResolutionStatus status = 1;
  repeated Variant candidates = 2; // At most 100, ordered by variant UUID.
  int64 total_matches = 3; // Never choose a candidate from an ambiguous result.
}
message GetInventoryRequest {
  string merchant_id = 1;
  string variant_id = 2;
}
enum AvailabilityStatus {
  AVAILABILITY_STATUS_UNSPECIFIED = 0;
  AVAILABLE = 1;
  UNAVAILABLE = 2;
}
message GetInventoryResponse {
  string variant_id = 1;
  int32 quantity = 2;
  AvailabilityStatus availability_status = 3;
  string updated_at = 4; // RFC 3339 UTC instant.
}
