name: stockping

services:
  frontend:
    build: ./frontend
    environment:
      DEMAND_API_TARGET: http://demand-service:8082
      CATALOG_API_TARGET: http://catalog-service:8081
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      PORT: "8081"
      CATALOG_GRPC_PORT: "9091"
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run python3 scripts/init-local-env.py}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8081}:8081"
      - "127.0.0.1:${CATALOG_GRPC_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  demand-service:
    build:
      context: .
      dockerfile: demand-service/Dockerfile
    environment:
      PORT: "8082"
      DEMAND_DB_URL: jdbc:postgresql://postgres:5432/demand_db
      DEMAND_DB_USER: demand_user
      DEMAND_DB_PASSWORD: ${DEMAND_DB_PASSWORD:?Set DEMAND_DB_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run python3 scripts/init-local-env.py}
      AUTH_JWT_EXPIRY_SECONDS: ${AUTH_JWT_EXPIRY_SECONDS:-1800}
      CATALOG_GRPC_HOST: catalog-service
      CATALOG_GRPC_PORT: "9091"
      CATALOG_GRPC_TIMEOUT_MS: ${CATALOG_GRPC_TIMEOUT_MS:-2000}
      SPRING_PROFILES_ACTIVE: ${DEMAND_PROFILES:-}
      DEMO_MERCHANT_ID: ${DEMO_MERCHANT_ID:-11111111-1111-1111-1111-111111111111}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.stockping.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMAND_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    environment:
      PORT: "8083"
    ports:
      - "127.0.0.1:${MESSAGING_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      DEMAND_DB_PASSWORD: ${DEMAND_DB_PASSWORD:?Set DEMAND_DB_PASSWORD}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?Set MESSAGING_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:

