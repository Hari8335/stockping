spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5434/catalog_db}
    username: ${CATALOG_DB_USER:catalog_user}
    password: ${CATALOG_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        options: "-c lock_timeout=5000 -c statement_timeout=15000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 10000
      jakarta.persistence.lock.timeout: 10000
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
  structured:
    format:
      console: ecs

catalog:
  grpc-port: ${CATALOG_GRPC_PORT:9091}

auth:
  jwt-secret: ${AUTH_JWT_SECRET}
