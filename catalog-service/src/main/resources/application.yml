spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000
    requested-heartbeat: 10
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        missing-queues-fatal: false
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5434/catalog_db}
    username: ${CATALOG_DB_USER:catalog_user}
    password: ${CATALOG_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        options: "-c lock_timeout=5000 -c statement_timeout=15000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 10000
      jakarta.persistence.lock.timeout: 10000
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    rabbit:
      enabled: false # The transactional outbox keeps REST available during broker outages.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
  structured:
    format:
      console: ecs

catalog:
  service-token: ${CATALOG_SERVICE_TOKEN:}
  grpc-port: ${CATALOG_GRPC_PORT:9091}

auth:
  jwt-secret: ${AUTH_JWT_SECRET}

stockping:
  events:
    enabled: ${STOCK_EVENTS_ENABLED:false}
