spring:
  application:
    name: demand-service
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
  structured:
    format:
      console: ecs
