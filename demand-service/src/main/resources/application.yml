spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000
    requested-heartbeat: 10
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        missing-queues-fatal: false
  application:
    name: demand-service
  datasource:
    url: ${DEMAND_DB_URL:jdbc:postgresql://localhost:5434/demand_db}
    username: ${DEMAND_DB_USER:demand_user}
    password: ${DEMAND_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        options: "-c lock_timeout=5000 -c statement_timeout=15000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 10000
      jakarta.persistence.lock.timeout: 10000
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    rabbit:
      enabled: false # The transactional outbox keeps REST available during broker outages.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    org.hibernate.orm.jdbc.error: OFF
  structured:
    format:
      console: ecs

catalog:
  service-token: ${CATALOG_SERVICE_TOKEN:}
  grpc-host: ${CATALOG_GRPC_HOST:localhost}
  grpc-port: ${CATALOG_GRPC_PORT:9091}
  grpc-timeout-ms: ${CATALOG_GRPC_TIMEOUT_MS:2000}
  grpc-tls: ${CATALOG_GRPC_TLS:false}
auth:
  login-enabled: true
  jwt-secret: ${AUTH_JWT_SECRET}
  jwt-expiry-seconds: ${AUTH_JWT_EXPIRY_SECONDS:1800}
demo:
  merchant-id: ${DEMO_MERCHANT_ID:11111111-1111-1111-1111-111111111111}
  admin-email: ${DEMO_ADMIN_EMAIL:admin@demo.stockping.local}
  admin-password: ${DEMO_ADMIN_PASSWORD:}

demand:
  grpc-enabled: ${DEMAND_GRPC_ENABLED:false}
  grpc-port: ${DEMAND_GRPC_PORT:9092}
  service-token: ${MESSAGING_DEMAND_TOKEN:}

stockping:
  events:
    enabled: ${STOCK_EVENTS_ENABLED:false}
  ai:
    enabled: ${STOCKPING_AI_ENABLED:true}
    provider: ${STOCKPING_AI_PROVIDER:mock}
    model: ${STOCKPING_AI_MODEL:gemini-1.5-flash}
    api-key: ${STOCKPING_AI_API_KEY:}
    api-url: ${STOCKPING_AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-ms: ${STOCKPING_AI_TIMEOUT_MS:3000}
    min-confidence: ${STOCKPING_AI_MIN_CONFIDENCE:0.70}
